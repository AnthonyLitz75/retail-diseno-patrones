<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <!-- Fondo Squircle: Azul noche profundo estilo app icon premium -->
    <linearGradient id="full-squircle-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#0f1d3f" />
      <stop offset="100%" stop-color="#080d1e" />
    </linearGradient>

    <!-- Borde Squircle con brillo sutil cian -->
    <linearGradient id="full-squircle-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#007bff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0d47a1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Gradiente del cuerpo de la P: Azul real a Cian eléctrico -->
    <linearGradient id="full-p-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="40%" stop-color="#0080ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Gradiente de la montaña interior -->
    <linearGradient id="full-peak-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002255" />
      <stop offset="50%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Brillo de píxeles -->
    <linearGradient id="full-pix-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00a8ff" />
    </linearGradient>

    <!-- Gradiente texto ANDINO -->
    <linearGradient id="full-text-andino" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>

  <!-- ISOTIPO SQUIRCLE CENTRADO (56x56 dentro de altura 64) -->
  <g transform="translate(4, 4) scale(0.56)">
    <!-- Squircle Base -->
    <rect x="3" y="3" width="94" height="94" rx="22" fill="url(#full-squircle-bg)" stroke="url(#full-squircle-border)" stroke-width="1.5" />

    <!-- Píxeles flotantes tech -->
    <rect x="21" y="21" width="8" height="8" rx="2" fill="url(#full-pix-cyan)" />
    <rect x="31" y="21" width="8" height="8" rx="2" fill="#00f0ff" />
    <rect x="21" y="31" width="8" height="8" rx="2" fill="#0066ff" />

    <!-- Cuerpo exterior de la P -->
    <path d="M 31 31 L 55 31 C 69 31 79 39 79 49 C 79 59 69 67 55 67 L 45 67 L 45 75.5 C 45 77.5 43.5 79 41.5 79 L 34.5 79 C 32.5 79 31 77.5 31 75.5 Z" fill="url(#full-p-grad)" />

    <!-- Vaciado interior -->
    <path d="M 45 42 L 54 42 C 61 42 66 45 66 49 C 66 53 61 56 54 56 L 45 56 Z" fill="#080d1e" />

    <!-- Cumbre andina interior -->
    <path d="M 45 56 L 51 48 L 54 51 L 60 44 L 66 50 C 65 53 60 56 54 56 L 45 56 Z" fill="url(#full-peak-grad)" />
    <path d="M 45 56 L 51 48 L 54 51 L 60 44 L 66 50" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95" />
    <path d="M 60 44 L 62 56" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.4" />
  </g>

  <!-- LOGOTIPO TIPOGRÁFICO -->
  <g transform="translate(70, 0)">
    <!-- PÍXEL -->
    <text x="0" y="31" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="1" fill="#0f172a">PÍXEL</text>
    <!-- ANDINO -->
    <text x="74" y="31" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" letter-spacing="1" fill="url(#full-text-andino)">ANDINO</text>
    <!-- SUBTÍTULO -->
    <text x="1" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#64748b">TECH STORE</text>
  </g>
</svg>
