<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="fav-squircle-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#0f1d3f" />
      <stop offset="100%" stop-color="#080d1e" />
    </linearGradient>
    <linearGradient id="fav-squircle-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#007bff" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="fav-p-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="40%" stop-color="#0080ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="fav-peak-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002255" />
      <stop offset="50%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#fav-squircle-bg)" stroke="url(#fav-squircle-border)" stroke-width="2" />

  <!-- Píxeles flotantes tech -->
  <rect x="21" y="21" width="8" height="8" rx="2" fill="#00f0ff" />
  <rect x="31" y="21" width="8" height="8" rx="2" fill="#38bdf8" />
  <rect x="21" y="31" width="8" height="8" rx="2" fill="#0066ff" />

  <!-- Cuerpo de la P -->
  <path d="M 31 31 L 55 31 C 69 31 79 39 79 49 C 79 59 69 67 55 67 L 45 67 L 45 75.5 C 45 77.5 43.5 79 41.5 79 L 34.5 79 C 32.5 79 31 77.5 31 75.5 Z" fill="url(#fav-p-grad)" />

  <!-- Vaciado interior -->
  <path d="M 45 42 L 54 42 C 61 42 66 45 66 49 C 66 53 61 56 54 56 L 45 56 Z" fill="#080d1e" />

  <!-- Cumbre andina interior -->
  <path d="M 45 56 L 51 48 L 54 51 L 60 44 L 66 50 C 65 53 60 56 54 56 L 45 56 Z" fill="url(#fav-peak-grad)" />
  <path d="M 45 56 L 51 48 L 54 51 L 60 44 L 66 50" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
