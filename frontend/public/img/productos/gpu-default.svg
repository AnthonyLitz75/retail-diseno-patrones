<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gpu-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="gpu-shroud" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="gpu-rgb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="fan-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="gpu-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Fondo sutil de tarjeta -->
  <rect width="400" height="300" rx="16" fill="url(#gpu-bg)"/>
  <rect x="12" y="12" width="376" height="276" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g filter="url(#gpu-shadow)" transform="translate(45, 60)">
    <!-- PCB posterior -->
    <rect x="0" y="30" width="280" height="125" rx="8" fill="#042f2e" stroke="#0d9488" stroke-width="1.5"/>
    <!-- Conector PCIe -->
    <rect x="35" y="155" width="130" height="12" rx="2" fill="#eab308"/>
    <g fill="#ca8a04">
      <rect x="40" y="155" width="3" height="10"/>
      <rect x="46" y="155" width="3" height="10"/>
      <rect x="52" y="155" width="3" height="10"/>
      <rect x="58" y="155" width="3" height="10"/>
      <rect x="64" y="155" width="3" height="10"/>
      <rect x="70" y="155" width="3" height="10"/>
      <rect x="85" y="155" width="3" height="10"/>
      <rect x="91" y="155" width="3" height="10"/>
      <rect x="97" y="155" width="3" height="10"/>
      <rect x="103" y="155" width="3" height="10"/>
      <rect x="109" y="155" width="3" height="10"/>
      <rect x="115" y="155" width="3" height="10"/>
      <rect x="121" y="155" width="3" height="10"/>
      <rect x="127" y="155" width="3" height="10"/>
      <rect x="133" y="155" width="3" height="10"/>
      <rect x="139" y="155" width="3" height="10"/>
      <rect x="145" y="155" width="3" height="10"/>
      <rect x="151" y="155" width="3" height="10"/>
      <rect x="157" y="155" width="3" height="10"/>
    </g>

    <!-- Bracket metálico I/O (Izquierda) -->
    <rect x="-18" y="15" width="18" height="150" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="-12" y="45" width="8" height="16" rx="2" fill="#64748b"/>
    <rect x="-12" y="75" width="8" height="16" rx="2" fill="#64748b"/>
    <rect x="-12" y="105" width="8" height="16" rx="2" fill="#64748b"/>

    <!-- Shroud frontal Gamer con ventiladores duales -->
    <rect x="0" y="15" width="310" height="140" rx="12" fill="url(#gpu-shroud)" stroke="#334155" stroke-width="2"/>

    <!-- Barra de luz RGB superior -->
    <rect x="25" y="20" width="260" height="6" rx="3" fill="url(#gpu-rgb)"/>

    <!-- Acentos angulares geométricos -->
    <path d="M 20 40 L 50 30 L 260 30 L 290 40" stroke="#475569" stroke-width="2" fill="none"/>
    <path d="M 20 145 L 50 152 L 260 152 L 290 145" stroke="#475569" stroke-width="2" fill="none"/>

    <!-- Ventilador 1 (Izquierdo) -->
    <circle cx="95" cy="88" r="50" fill="#090d16" stroke="#1e293b" stroke-width="3"/>
    <circle cx="95" cy="88" r="48" fill="none" stroke="url(#gpu-rgb)" stroke-width="1.5" stroke-dasharray="8 6"/>
    <!-- Aspas Ventilador 1 -->
    <g transform="translate(95, 88)">
      <path d="M -8 -45 C -2 -30 2 -30 8 -45 Z" fill="#334155"/>
      <path d="M 32 -32 C 22 -22 25 -16 38 -20 Z" fill="#334155"/>
      <path d="M 45 -8 C 30 -2 30 2 45 8 Z" fill="#334155"/>
      <path d="M 32 32 C 22 22 16 25 20 38 Z" fill="#334155"/>
      <path d="M 8 45 C 2 30 -2 30 -8 45 Z" fill="#334155"/>
      <path d="M -32 32 C -22 22 -25 16 -38 20 Z" fill="#334155"/>
      <path d="M -45 8 C -30 2 -30 -2 -45 -8 Z" fill="#334155"/>
      <path d="M -32 -32 C -22 -22 -16 -25 -20 -38 Z" fill="#334155"/>
      <circle cx="0" cy="0" r="18" fill="url(#fan-center)" stroke="#00f0ff" stroke-width="1.5"/>
      <!-- Logo Píxel Andino en el centro del fan -->
      <polygon points="0,-8 7,5 -7,5" fill="#00f0ff"/>
    </g>

    <!-- Ventilador 2 (Derecho) -->
    <circle cx="215" cy="88" r="50" fill="#090d16" stroke="#1e293b" stroke-width="3"/>
    <circle cx="215" cy="88" r="48" fill="none" stroke="url(#gpu-rgb)" stroke-width="1.5" stroke-dasharray="8 6"/>
    <!-- Aspas Ventilador 2 -->
    <g transform="translate(215, 88)">
      <path d="M -8 -45 C -2 -30 2 -30 8 -45 Z" fill="#334155"/>
      <path d="M 32 -32 C 22 -22 25 -16 38 -20 Z" fill="#334155"/>
      <path d="M 45 -8 C 30 -2 30 2 45 8 Z" fill="#334155"/>
      <path d="M 32 32 C 22 22 16 25 20 38 Z" fill="#334155"/>
      <path d="M 8 45 C 2 30 -2 30 -8 45 Z" fill="#334155"/>
      <path d="M -32 32 C -22 22 -25 16 -38 20 Z" fill="#334155"/>
      <path d="M -45 8 C -30 2 -30 -2 -45 -8 Z" fill="#334155"/>
      <path d="M -32 -32 C -22 -22 -16 -25 -20 -38 Z" fill="#334155"/>
      <circle cx="0" cy="0" r="18" fill="url(#fan-center)" stroke="#00f0ff" stroke-width="1.5"/>
      <!-- Logo Píxel Andino en el centro del fan -->
      <polygon points="0,-8 7,5 -7,5" fill="#00f0ff"/>
    </g>

    <!-- Conector de energía 8-pin -->
    <rect x="260" y="8" width="34" height="12" rx="2" fill="#020617" stroke="#475569" stroke-width="1"/>
    <g fill="#94a3b8">
      <rect x="264" y="11" width="5" height="6"/>
      <rect x="271" y="11" width="5" height="6"/>
      <rect x="278" y="11" width="5" height="6"/>
      <rect x="285" y="11" width="5" height="6"/>
    </g>
  </g>

  <!-- Badge inferior Píxel Andino -->
  <text x="200" y="265" text-anchor="middle" fill="#0284c7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TARJETA GRÁFICA GAMING</text>
</svg>
