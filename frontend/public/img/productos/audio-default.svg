<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="audio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="headband-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="earcup-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="audio-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#audio-bg)"/>
  <rect x="12" y="12" width="376" height="276" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g filter="url(#audio-shadow)" transform="translate(100, 35)">
    <!-- Diadema superior acolchada -->
    <path d="M 20 120 C 20 40, 180 40, 180 120" stroke="url(#headband-grad)" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 40 100 C 40 45, 160 45, 160 100" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Brazo extensible izquierdo -->
    <rect x="12" y="110" width="16" height="35" rx="3" fill="#64748b"/>
    <!-- Brazo extensible derecho -->
    <rect x="172" y="110" width="16" height="35" rx="3" fill="#64748b"/>

    <!-- Copa Izquierda (Auricular) -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="40" height="65" rx="18" fill="url(#earcup-grad)" stroke="#334155" stroke-width="1.5"/>
      <!-- Almohadilla -->
      <rect x="28" y="5" width="14" height="55" rx="7" fill="#020617"/>
      <!-- Anillo RGB -->
      <circle cx="18" cy="32" r="12" fill="none" stroke="#00f0ff" stroke-width="2"/>
      <polygon points="18,26 24,36 12,36" fill="#00f0ff"/>
    </g>

    <!-- Copa Derecha (Auricular) -->
    <g transform="translate(160, 130)">
      <rect x="0" y="0" width="40" height="65" rx="18" fill="url(#earcup-grad)" stroke="#334155" stroke-width="1.5"/>
      <!-- Almohadilla -->
      <rect x="-2" y="5" width="14" height="55" rx="7" fill="#020617"/>
      <!-- Anillo RGB -->
      <circle cx="22" cy="32" r="12" fill="none" stroke="#00f0ff" stroke-width="2"/>
      <polygon points="22,26 28,36 16,36" fill="#00f0ff"/>
    </g>

    <!-- Micrófono boom gamer -->
    <path d="M 20 185 C 30 215, 75 225, 95 210" stroke="#475569" stroke-width="4" stroke-linecap="round" fill="none"/>
    <rect x="92" y="202" width="16" height="10" rx="4" fill="#020617" stroke="#00f0ff" stroke-width="1"/>
  </g>

  <text x="200" y="265" text-anchor="middle" fill="#0284c7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">AUDIO GAMING &amp; HIGH-FIDELITY</text>
</svg>
