<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ram-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="ram-hs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="ram-rgb-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="25%" stop-color="#0066ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="75%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="ram-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#ram-bg)"/>
  <rect x="12" y="12" width="376" height="276" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g filter="url(#ram-shadow)" transform="translate(40, 75)">
    <!-- Barra difusora RGB Superior -->
    <path d="M 15 25 L 305 25 L 315 35 L 5 35 Z" fill="url(#ram-rgb-bar)"/>

    <!-- Disipador de calor (Heatspreader metálico) -->
    <path d="M 5 35 L 315 35 L 315 110 L 305 120 L 15 120 L 5 110 Z" fill="url(#ram-hs)" stroke="#334155" stroke-width="1.5"/>

    <!-- Acentos geométricos y cortes angulares -->
    <polygon points="40,45 80,45 70,75 30,75" fill="#334155" fill-opacity="0.6"/>
    <polygon points="90,45 130,45 120,75 80,75" fill="#334155" fill-opacity="0.6"/>
    <polygon points="190,45 230,45 220,75 180,75" fill="#334155" fill-opacity="0.6"/>
    <polygon points="240,45 280,45 270,75 230,75" fill="#334155" fill-opacity="0.6"/>

    <!-- Logo central -->
    <rect x="135" y="55" width="50" height="25" rx="4" fill="#020617" stroke="#00f0ff" stroke-width="1"/>
    <text x="160" y="72" text-anchor="middle" fill="#00f0ff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">DDR5</text>

    <!-- Conector de pines dorados (Inferior) -->
    <rect x="15" y="120" width="135" height="14" fill="#ca8a04"/>
    <rect x="170" y="120" width="135" height="14" fill="#ca8a04"/>

    <!-- Pines individuales -->
    <g fill="#eab308">
      <rect x="20" y="120" width="3" height="12"/>
      <rect x="26" y="120" width="3" height="12"/>
      <rect x="32" y="120" width="3" height="12"/>
      <rect x="38" y="120" width="3" height="12"/>
      <rect x="44" y="120" width="3" height="12"/>
      <rect x="50" y="120" width="3" height="12"/>
      <rect x="56" y="120" width="3" height="12"/>
      <rect x="62" y="120" width="3" height="12"/>
      <rect x="68" y="120" width="3" height="12"/>
      <rect x="74" y="120" width="3" height="12"/>
      <rect x="80" y="120" width="3" height="12"/>
      <rect x="86" y="120" width="3" height="12"/>
      <rect x="92" y="120" width="3" height="12"/>
      <rect x="98" y="120" width="3" height="12"/>
      <rect x="104" y="120" width="3" height="12"/>
      <rect x="110" y="120" width="3" height="12"/>
      <rect x="116" y="120" width="3" height="12"/>
      <rect x="122" y="120" width="3" height="12"/>
      <rect x="128" y="120" width="3" height="12"/>
      <rect x="134" y="120" width="3" height="12"/>
      <rect x="140" y="120" width="3" height="12"/>

      <rect x="175" y="120" width="3" height="12"/>
      <rect x="181" y="120" width="3" height="12"/>
      <rect x="187" y="120" width="3" height="12"/>
      <rect x="193" y="120" width="3" height="12"/>
      <rect x="199" y="120" width="3" height="12"/>
      <rect x="205" y="120" width="3" height="12"/>
      <rect x="211" y="120" width="3" height="12"/>
      <rect x="217" y="120" width="3" height="12"/>
      <rect x="223" y="120" width="3" height="12"/>
      <rect x="229" y="120" width="3" height="12"/>
      <rect x="235" y="120" width="3" height="12"/>
      <rect x="241" y="120" width="3" height="12"/>
      <rect x="247" y="120" width="3" height="12"/>
      <rect x="253" y="120" width="3" height="12"/>
      <rect x="259" y="120" width="3" height="12"/>
      <rect x="265" y="120" width="3" height="12"/>
      <rect x="271" y="120" width="3" height="12"/>
      <rect x="277" y="120" width="3" height="12"/>
      <rect x="283" y="120" width="3" height="12"/>
      <rect x="289" y="120" width="3" height="12"/>
      <rect x="295" y="120" width="3" height="12"/>
    </g>
  </g>

  <text x="200" y="265" text-anchor="middle" fill="#6366f1" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">MEMORIA RAM GAMING RGB</text>
</svg>
