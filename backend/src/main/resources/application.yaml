spring:
  application:
    name: retail
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/retail_diseno_patrones}
    username: ${DB_USER:postgres}
    # Sin valor por defecto: si falta DB_PASSWORD el backend no arranca, en lugar de
    # intentar con una contraseña conocida.
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

server:
  port: ${PORT:8081}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # En producción (HTTPS) define SESSION_COOKIE_SECURE=true. En local queda en false.
        secure: ${SESSION_COOKIE_SECURE:false}