# Configuración para Análisis Automático de SonarQube Cloud (equivalente a sonar-project.properties)
sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test,frontend/test
sonar.cpd.exclusions=frontend/test/**,backend/src/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/.mvn/**,backend/target/**,database/legado/**,specs/**,docs/**
sonar.sourceEncoding=UTF-8
